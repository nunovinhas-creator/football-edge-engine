name: Automatic Live Goal Logger & Engine

# `schedule` aciona o Scanner autónomo (src/alerts/live_scanner.py — apenas
# Alerta Live Premium) de 2 em 2 minutos, entre as 08:00 e as 23:58 UTC,
# todos os dias. `workflow_dispatch` mantém-se disponível para execução
# manual do pipeline completo existente (src/engine/live_monitor.py, com
# alerta +EV e logging para data/live_history.db) — ver step "4b." abaixo.
on:
  schedule:
    - cron: '*/2 8-23 * * *'
  workflow_dispatch:

concurrency:
  group: live-logger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-logger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v3

      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo "===== REQUIREMENTS ====="
          cat requirements.txt

          echo "===== INSTALLED PACKAGES ====="
          pip list

          echo "===== TEST RICH ====="
          python -c "import rich; print('Rich OK')"

      - name: 4a. Executar Scanner Live Autónomo (execução agendada — apenas Alerta Live Premium)
        if: github.event_name == 'schedule'
        env:
          BSD_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python src/alerts/live_scanner.py

      - name: 4b. Executar Monitorização e Logger (execução manual — pipeline completo)
        if: github.event_name != 'schedule'
        env:
          BSD_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python src/engine/live_monitor.py

      - name: 4.5 Recalcular Labels (goal_in_next_15m)
        run: |
          PYTHONPATH=. python src/training/create_labels.py

      - name: 5. Guardar Alterações na Base de Dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/live_history.db ]; then
            git add -f data/live_history.db
          fi
          # data/live_alerts.db guarda o estado de anti-spam do Alerta Live
          # Premium (LiveAlertMonitor + ScannerAntiSpamGuard) — sem o
          # persistir aqui, cada execução agendada arrancaria de um
          # checkout limpo e perderia o cooldown/anti-spam entre ciclos.
          if [ -f data/live_alerts.db ]; then
            git add -f data/live_alerts.db
          fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(logger): auto-update live history db [skip ci]" && git push)
