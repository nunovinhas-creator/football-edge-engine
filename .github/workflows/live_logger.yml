name: Automatic Live Goal Logger & Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-logger:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v3

      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo "===== REQUIREMENTS ====="
          cat requirements.txt

          echo "===== INSTALLED PACKAGES ====="
          pip list

          echo "===== TEST RICH ====="
          python -c "import rich; print('Rich OK')"

      - name: 3.5 Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src.telegram.notifier import send_message; send_message('GitHub Actions Telegram OK')"

      - name: 4. Executar Monitorização e Logger
        env:
          BSD_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python src/engine/live_monitor.py

      - name: 4.5 Recalcular Labels (goal_in_next_15m)
        run: |
          PYTHONPATH=. python src/training/create_labels.py

      - name: 5. Guardar Alterações na Base de Dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/live_history.db ]; then
            git add -f data/live_history.db
          fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(logger): auto-update live history db [skip ci]" && git push)
