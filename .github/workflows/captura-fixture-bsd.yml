name: Captura Fixture BSD Events v2

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capturar-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Pedido de amostra (limit=5)
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          echo "::add-mask::$BZZOIRO_API_KEY"
          mkdir -p tests/fixtures
          http_code=$(curl -s -o /tmp/sample_response.json -w "%{http_code}" \
            -H "Authorization: Token ${BZZOIRO_API_KEY}" \
            -H "Accept: application/json" \
            "https://sports.bzzoiro.com/api/v2/events/?limit=5")
          echo "SAMPLE_HTTP_CODE=$http_code" >> "$GITHUB_ENV"

      - name: Validar resposta da amostra
        run: |
          {
            echo "## Captura de fixture — /api/v2/events/"
            echo ""
            echo "### Pedido 1 — amostra (limit=5)"
            echo "- HTTP status: \`$SAMPLE_HTTP_CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SAMPLE_HTTP_CODE" != "200" ]; then
            {
              echo "- **FALHOU** — resposta não foi 200."
              echo ""
              echo '```'
              cat /tmp/sample_response.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Pedido 1 falhou com HTTP $SAMPLE_HTTP_CODE" >&2
            exit 1
          fi

      - name: Analisar estrutura e gravar fixture
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open("/tmp/sample_response.json") as f:
              data = json.load(f)

          summary_lines = []

          if isinstance(data, list):
              shape = "array simples"
              events = data
          elif isinstance(data, dict):
              if isinstance(data.get("results"), list):
                  shape = f"envelope (chave 'results'; chaves de topo: {sorted(data.keys())})"
                  events = data["results"]
              elif isinstance(data.get("events"), list):
                  shape = f"envelope (chave 'events'; chaves de topo: {sorted(data.keys())})"
                  events = data["events"]
              else:
                  shape = f"objeto inesperado (chaves de topo: {sorted(data.keys())})"
                  events = []
          else:
              shape = f"tipo inesperado: {type(data).__name__}"
              events = []

          summary_lines.append(f"- Formato da resposta: {shape}")
          summary_lines.append(f"- Nº de eventos na amostra: {len(events)}")

          league_hits = []
          if events and isinstance(events[0], dict):
              first = events[0]
              fields = sorted(first.keys())
              summary_lines.append(f"- Campos de um evento ({len(fields)}): `{', '.join(fields)}`")

              def scan(obj, path=""):
                  found = []
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          kp = f"{path}.{k}" if path else k
                          if any(t in k.lower() for t in ("league", "competition", "tournament")):
                              found.append((kp, v))
                          if isinstance(v, (dict, list)):
                              found.extend(scan(v, kp))
                  elif isinstance(obj, list):
                      for i, item in enumerate(obj[:1]):
                          found.extend(scan(item, f"{path}[{i}]"))
                  return found

              league_hits = scan(first)

          if league_hits:
              items = "; ".join(f"`{k}` = {v!r}" for k, v in league_hits[:5])
              summary_lines.append(f"- Campo(s) de liga/competição encontrados: {items}")
          else:
              summary_lines.append("- Nenhum campo com nome de liga/competição encontrado no primeiro evento.")

          os.makedirs("tests/fixtures", exist_ok=True)
          with open("tests/fixtures/events_v2_sample.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary_lines) + "\n")
          PYEOF

      - name: Verificar que o fixture não contém segredos
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          echo "::add-mask::$BZZOIRO_API_KEY"
          if grep -qF -- "$BZZOIRO_API_KEY" tests/fixtures/events_v2_sample.json; then
            echo "ERRO: o ficheiro de fixture contém a chave de API. A abortar sem expor o ficheiro." >&2
            exit 1
          fi
          if grep -qiE '"(authorization|api[_-]?key|access[_-]?token|bearer)"[[:space:]]*:' tests/fixtures/events_v2_sample.json; then
            echo "ERRO: o ficheiro de fixture contém um campo com nome sensível (authorization/api_key/token). A abortar." >&2
            exit 1
          fi
          echo "- Verificação de segredos no fixture: OK, nenhuma chave/token encontrada." >> "$GITHUB_STEP_SUMMARY"

      - name: Pedido de cobertura 24h (limit=200)
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          echo "::add-mask::$BZZOIRO_API_KEY"
          date_from=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          date_to=$(date -u -d "+24 hours" +%Y-%m-%dT%H:%M:%SZ)
          echo "WINDOW_FROM=$date_from" >> "$GITHUB_ENV"
          echo "WINDOW_TO=$date_to" >> "$GITHUB_ENV"
          http_code=$(curl -s -o /tmp/window_response.json -w "%{http_code}" \
            -H "Authorization: Token ${BZZOIRO_API_KEY}" \
            -H "Accept: application/json" \
            --get \
            --data-urlencode "date_from=${date_from}" \
            --data-urlencode "date_to=${date_to}" \
            --data-urlencode "limit=200" \
            "https://sports.bzzoiro.com/api/v2/events/")
          echo "WINDOW_HTTP_CODE=$http_code" >> "$GITHUB_ENV"

      - name: Validar e reportar pedido 24h
        run: |
          {
            echo ""
            echo "### Pedido 2 — próximas 24h (date_from=$WINDOW_FROM, date_to=$WINDOW_TO, limit=200)"
            echo "- HTTP status: \`$WINDOW_HTTP_CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WINDOW_HTTP_CODE" != "200" ]; then
            {
              echo "- **FALHOU** — resposta não foi 200."
              echo ""
              echo '```'
              cat /tmp/window_response.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Pedido 2 falhou com HTTP $WINDOW_HTTP_CODE" >&2
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, os
          with open("/tmp/window_response.json") as f:
              data = json.load(f)
          if isinstance(data, list):
              events = data
          elif isinstance(data, dict):
              events = data.get("results") or data.get("events") or []
          else:
              events = []
          n = len(events)
          lines = [f"- Nº de eventos nas próximas 24h: {n}"]
          if n == 200:
              lines.append("- **Atenção: vieram exatamente 200 eventos — possível truncagem pelo limite de página (max=200).**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Analisar estrutura, gravar fixture da janela e reportar métricas
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime

          with open("/tmp/window_response.json") as f:
              data = json.load(f)

          window_from = os.environ["WINDOW_FROM"]
          window_to = os.environ["WINDOW_TO"]

          if isinstance(data, dict):
              results = data.get("results") or data.get("events") or []
              top_count = data.get("count")
              next_url = data.get("next")
              previous_url = data.get("previous")
          elif isinstance(data, list):
              results = data
              top_count = None
              next_url = None
              previous_url = None
          else:
              results = []
              top_count = None
              next_url = None
              previous_url = None

          n_results = len(results)

          league_ids = sorted(
              {e.get("league_id") for e in results if isinstance(e, dict) and "league_id" in e},
              key=lambda v: (v is None, v),
          )
          statuses = sorted(
              {e.get("status") for e in results if isinstance(e, dict) and "status" in e},
              key=lambda v: (v is None, str(v)),
          )

          def _parse(dt_str):
              if not dt_str:
                  return None
              try:
                  return datetime.fromisoformat(dt_str.replace("Z", "+00:00"))
              except ValueError:
                  return None

          window_from_dt = _parse(window_from)
          window_to_dt = _parse(window_to)

          in_window = 0
          out_of_window = 0
          no_date = 0
          for event in results:
              if not isinstance(event, dict):
                  continue
              event_dt = _parse(event.get("event_date"))
              if event_dt is None:
                  no_date += 1
                  continue
              if window_from_dt is not None and window_to_dt is not None and window_from_dt <= event_dt <= window_to_dt:
                  in_window += 1
              else:
                  out_of_window += 1

          # Nunca commitar milhares de linhas: o ficheiro no repositório fica
          # truncado a uma amostra; o `count` real (não o tamanho truncado) é
          # sempre o reportado no resumo.
          MAX_RESULTS_IN_FIXTURE = 20
          was_truncated = n_results > MAX_RESULTS_IN_FIXTURE
          truncated_results = results[:MAX_RESULTS_IN_FIXTURE]

          fixture_payload = {
              "count": top_count,
              "next": next_url,
              "previous": previous_url,
              "results": truncated_results,
          }

          os.makedirs("tests/fixtures", exist_ok=True)
          with open("tests/fixtures/events_v2_window.json", "w") as f:
              json.dump(fixture_payload, f, indent=2, ensure_ascii=False)
              f.write("\n")

          lines = [
              "",
              "### Estrutura e métricas — janela 24h (date_from/date_to)",
              f"- `count` (topo do envelope): `{top_count}`",
              f"- Nº de eventos em `results`: `{n_results}`",
          ]
          if was_truncated:
              lines.append(
                  f"- **Fixture commitado truncado a {MAX_RESULTS_IN_FIXTURE} eventos** "
                  f"(de {n_results} recebidos); `count` real (`{top_count}`) mantido no ficheiro, "
                  "não o tamanho truncado."
              )
          lines.append(
              "- `next` preenchido: "
              + ("`sim` — " + next_url if next_url else "`não`")
          )
          lines.append(f"- Nº de `league_id` distintos: `{len(league_ids)}`")
          lines.append(
              "- Valores de `status` presentes: "
              + (", ".join(f"`{s}`" for s in statuses) if statuses else "(nenhum)")
          )
          lines.append(
              f"- Datas dentro da janela [`{window_from}`, `{window_to}`]: "
              f"`{in_window}` dentro / `{out_of_window}` fora"
              + (f" / `{no_date}` sem `event_date` válido" if no_date else "")
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Verificar que o fixture da janela não contém segredos
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          echo "::add-mask::$BZZOIRO_API_KEY"
          if grep -qF -- "$BZZOIRO_API_KEY" tests/fixtures/events_v2_window.json; then
            echo "ERRO: o ficheiro de fixture da janela contém a chave de API. A abortar sem expor o ficheiro." >&2
            exit 1
          fi
          if grep -qiE '"(authorization|api[_-]?key|access[_-]?token|bearer)"[[:space:]]*:' tests/fixtures/events_v2_window.json; then
            echo "ERRO: o ficheiro de fixture da janela contém um campo com nome sensível (authorization/api_key/token). A abortar." >&2
            exit 1
          fi
          echo "- Verificação de segredos no fixture da janela: OK, nenhuma chave/token encontrada." >> "$GITHUB_STEP_SUMMARY"

      - name: Criar branch, commit e abrir PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Recria o branch de dados a partir do HEAD atual em cada execução —
          # torna o workflow repetível mesmo que o branch já exista de um run anterior.
          git checkout -B data/fixture-bsd-v2
          git add tests/fixtures/events_v2_sample.json tests/fixtures/events_v2_window.json
          git commit -m "test: adiciona fixtures de amostra e de janela 24h de /api/v2/events/" || echo "Fixtures idênticos ao commit anterior — nada para gravar."
          # --force simples (não --force-with-lease): o runner nunca buscou o
          # branch remoto, por isso não teria uma ref local para comparar, e
          # este branch é gerido inteiramente por este workflow (só dados, sem
          # commits manuais esperados).
          git push --force -u origin data/fixture-bsd-v2

          # Um push (mesmo com --force) para um branch com PR aberto atualiza
          # esse PR automaticamente — só criamos um novo se não existir nenhum.
          existing_pr=$(gh pr list --head data/fixture-bsd-v2 --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "- PR #$existing_pr já existia para \`data/fixture-bsd-v2\` — atualizado com este commit, sem duplicar." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create \
              --title "test: fixture de amostra de /api/v2/events/" \
              --body "Fixture capturado via workflow_dispatch (\`captura-fixture-bsd.yml\`) a partir de \`GET /api/v2/events/?limit=5\`. Ver o resumo (\`GITHUB_STEP_SUMMARY\`) da execução para detalhes de estrutura da resposta e contagem de eventos na janela de 24h." \
              --base "${{ github.event.repository.default_branch }}" \
              --head data/fixture-bsd-v2
          fi
