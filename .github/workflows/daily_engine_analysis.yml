name: Football Edge Engine - Daily Analysis

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-engine-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Backtest e Enviar Alertas
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python research/backtest_engine.py

      - name: Guardar Gráfico da Banca como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bankroll-curve-chart
          path: research/bankroll_curve.png
          retention-days: 7
